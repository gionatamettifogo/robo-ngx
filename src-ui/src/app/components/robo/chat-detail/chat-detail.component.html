<div class="robo-chat-detail-page" *ngIf="chatState.state$ | async as state">
  <div class="robo-chat-detail-content container-fluid p-3">
    <div class="robo-chat-detail-shell">
      <div class="mb-3">
        <a routerLink="/chats" class="text-decoration-none" i18n="Robo|Back link from chat detail to chats list">← Back to Chats</a>
      </div>

      <div class="d-flex justify-content-between align-items-start mb-3 robo-chat-header">
        <div class="robo-chat-heading">
          <h2 class="mb-0">{{ state.chat?.title || chatFallbackTitle }}</h2>
          <small class="text-muted robo-chat-model-label">{{ state.chat?.agent_id }}</small>
        </div>
        <div class="robo-chat-title-actions">
          <pngx-robo-icon-action-button
            icon="pencil"
            [tooltip]="renameChatTooltip"
            [ariaLabel]="renameChatAriaLabel"
            (pressed)="renameChat()"
          />
          <pngx-robo-icon-action-button
            icon="trash"
            [tooltip]="deleteChatTooltip"
            [ariaLabel]="deleteChatAriaLabel"
            (pressed)="deleteChat()"
          />
        </div>
      </div>

      <div *ngIf="state.loading" class="text-muted mb-3" i18n="Robo|Chat detail loading state">Loading conversation...</div>
      <div *ngIf="state.error" class="alert alert-danger py-2">{{ state.error }}</div>

      <div *ngIf="state.messages.length === 0" class="text-muted" i18n="Robo|Empty chat detail state">
        No messages yet.
      </div>

      <div *ngFor="let message of state.messages" class="robo-message"
        [class.robo-message--user]="message.role === 'user'">
        <ng-container *ngIf="message.role === 'user'; else assistantMessage">
          <div class="robo-user-message">
            <div class="robo-user-bubble">
              {{ message.content }}
            </div>
            <div class="robo-user-actions">
              <pngx-robo-icon-action-button icon="clipboard" [tooltip]="copyMessageTooltip" [ariaLabel]="copyUserMessageAriaLabel"
                (pressed)="copyMessage(message.content)" />
              <pngx-robo-icon-action-button icon="trash" [tooltip]="deleteMessageTooltip" [ariaLabel]="deleteUserMessageAriaLabel"
                (pressed)="deleteMessage(message)" />
            </div>
          </div>
        </ng-container>

        <ng-template #assistantMessage>
          <div class="robo-assistant-message">
            <button *ngIf="
                shouldShowThinkingToggle(
                  message,
                  state.thinkingByMessageId[message.id]
                )
              " class="robo-thinking-toggle mt-1" type="button">
              <i-bs name="lightbulb"></i-bs>
              <span>{{ thinkingToggleLabel(message) }}</span>
            </button>

            <markdown class="robo-assistant-markdown mt-2" [data]="message.content" />

            <div *ngIf="shouldShowAssistantActions(message)" class="robo-assistant-actions">
              <pngx-robo-icon-action-button icon="clipboard" [tooltip]="copyResponseTooltip" [ariaLabel]="copyResponseAriaLabel"
                (pressed)="copyMessage(message.content)" />
              <pngx-robo-icon-action-button *ngIf="message.feedback?.vote !== -1" icon="hand-thumbs-up" [tooltip]="positiveFeedbackTooltip(message)"
                [ariaLabel]="goodResponseAriaLabel" [selected]="message.feedback?.vote === 1"
                (pressed)="togglePositiveFeedback(message)" />
              <pngx-robo-icon-action-button *ngIf="message.feedback?.vote !== 1" icon="hand-thumbs-down" [tooltip]="negativeFeedbackTooltip(message)"
                [ariaLabel]="badResponseAriaLabel" [selected]="message.feedback?.vote === -1"
                (pressed)="toggleNegativeFeedback(message)" />
            </div>

            <small class="text-muted">
              <span *ngIf="state.thinkingByMessageId[message.id]" class="mt-2 d-inline-block fst-italic">
                {{ state.thinkingByMessageId[message.id] }}
              </span>
            </small>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="robo-chat-detail-panel">
    <div class="robo-chat-detail-composer">
      <pngx-robo-chat-composer [value]="state.pendingInput" (valueChange)="chatState.setPendingInput($event)"
        [disabled]="!!state.activeStream?.isStreaming" [submitDisabled]="
          !!state.activeStream?.isStreaming || !state.pendingInput.trim()
        " [showStopButton]="!!state.activeStream?.isStreaming" (submit)="sendMessage()"
        (stop)="chatState.stopStreaming()" />
      <div class="robo-chat-detail-note">{{ composerNote }}</div>
    </div>
  </div>
</div>
