<div class="robo-chat-detail-page" *ngIf="chatState.state$ | async as state">
  <div class="robo-chat-detail-content container-fluid p-3">
    <div class="robo-chat-detail-shell">
      <div class="mb-3">
        <a routerLink="/chats" class="text-decoration-none">← Back to chats</a>
      </div>

      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h2 class="mb-0">{{ state.chat?.title || 'Chat' }}</h2>
          <small class="text-muted">Agent: {{ state.chat?.agent_id }}</small>
        </div>
      </div>

      <div *ngIf="state.loading" class="text-muted mb-3">Loading conversation...</div>
      <div *ngIf="state.error" class="alert alert-danger py-2">{{ state.error }}</div>

      <div *ngIf="state.messages.length === 0" class="text-muted">
        No messages yet.
      </div>

      <div
        *ngFor="let message of state.messages"
        class="robo-message"
        [class.robo-message--user]="message.role === 'user'"
      >
        <ng-container *ngIf="message.role === 'user'; else assistantMessage">
          <div class="robo-user-message">
            <div class="robo-user-bubble">
              {{ message.content }}
            </div>
            <div class="robo-user-actions">
              <pngx-robo-icon-action-button
                icon="clipboard"
                tooltip="Copy message"
                ariaLabel="Copy user message"
              />
              <pngx-robo-icon-action-button
                icon="trash"
                tooltip="Delete message"
                ariaLabel="Delete user message"
              />
            </div>
          </div>
        </ng-container>

        <ng-template #assistantMessage>
          <div class="robo-assistant-message">
            <button
              *ngIf="
                shouldShowThinkingToggle(
                  message,
                  state.thinkingByMessageId[message.id]
                )
              "
              class="robo-thinking-toggle mt-1"
              type="button"
            >
              <i-bs name="lightbulb"></i-bs>
              <span>{{ thinkingToggleLabel(message) }}</span>
            </button>

            <markdown
              class="robo-assistant-markdown mt-2"
              [data]="message.content"
            />

            <div
              *ngIf="shouldShowAssistantActions(message)"
              class="robo-assistant-actions"
            >
              <pngx-robo-icon-action-button
                icon="clipboard"
                tooltip="Copy response"
                ariaLabel="Copy response"
              />
              <pngx-robo-icon-action-button
                icon="hand-thumbs-up"
                tooltip="Good response"
                ariaLabel="Good response"
              />
              <pngx-robo-icon-action-button
                icon="hand-thumbs-down"
                tooltip="Bad response"
                ariaLabel="Bad response"
              />
              <pngx-robo-icon-action-button
                icon="share"
                tooltip="Share"
                ariaLabel="Share"
              />
            </div>

            <small class="text-muted">
              <span
                *ngIf="state.thinkingByMessageId[message.id]"
                class="mt-2 d-inline-block fst-italic"
              >
                {{ state.thinkingByMessageId[message.id] }}
              </span>
            </small>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="robo-chat-detail-panel">
    <div class="robo-chat-detail-composer">
      <pngx-robo-chat-composer
        [value]="state.pendingInput"
        (valueChange)="chatState.setPendingInput($event)"
        [disabled]="!!state.activeStream?.isStreaming"
        [placeholder]="'Come posso aiutarti oggi?'"
        [submitDisabled]="
          !!state.activeStream?.isStreaming || !state.pendingInput.trim()
        "
        [showStopButton]="!!state.activeStream?.isStreaming"
        (submit)="sendMessage()"
        (stop)="chatState.stopStreaming()"
      />
    </div>
  </div>
</div>
