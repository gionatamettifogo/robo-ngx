<div class="robo-chats-page">
  <header class="robo-page-header">
    <div class="robo-page-brand fw-semibold small">indena-legal</div>
    <button class="robo-icon-button" type="button" disabled aria-label="More options">
      <i-bs name="three-dots"></i-bs>
    </button>
  </header>

  <div class="robo-page-title h3 mb-4 text-center">How can I help you today?</div>

  <section class="robo-composer">
    <div class="robo-composer-shell">
      <div class="robo-composer-left">
        <button
          class="robo-composer-affordance"
          type="button"
          aria-label="Add attachment"
        >
          <i-bs name="plus"></i-bs>
        </button>
      </div>

      <div class="robo-composer-input-wrap">
        <textarea
          class="robo-composer-textarea"
          [ngModel]="prompt"
          (ngModelChange)="prompt = $event"
          (input)="autoResizeComposer($event)"
          (keydown)="onComposerKeydown($event)"
          [disabled]="creating"
          placeholder="Ask anything"
          rows="1"
        ></textarea>
      </div>

      <div class="robo-composer-right ms-auto">
        <button class="robo-composer-affordance" type="button" aria-label="Voice input">
          <i-bs name="mic"></i-bs>
        </button>
        <button
          class="robo-send-button"
          type="button"
          (click)="createChat()"
          [disabled]="creating || !prompt.trim()"
          aria-label="Send message"
        >
          <i-bs name="arrow-up-circle-fill"></i-bs>
        </button>
      </div>
    </div>
  </section>

  <div class="robo-tabs">
    <button
      class="robo-tab"
      type="button"
      [ngClass]="{ active: activeTab === 'chats' }"
      (click)="activeTab = 'chats'"
    >
      Chats
    </button>
    <button
      class="robo-tab"
      type="button"
      [ngClass]="{ active: activeTab === 'sources' }"
      disabled
    >
      Sources
    </button>
  </div>

  <div *ngIf="loading" class="robo-loading-state text-body-secondary">Loading chats...</div>

  <div *ngIf="!loading && chatItems.length === 0" class="robo-empty-state text-body-secondary">
    No chats yet.
  </div>

  <section class="robo-chat-list" *ngIf="!loading && chatItems.length > 0">
    <div
      class="robo-chat-row"
      *ngFor="let item of chatItems; trackBy: trackByChatId"
      (click)="openChat(item.chat.id)"
    >
      <div class="robo-chat-main">
        <div class="robo-chat-title fw-semibold">
          {{ item.chat.title }}
        </div>
        <div class="robo-chat-preview small text-body-secondary">
          {{ lastMessagePreview(item) }}
        </div>
      </div>

      <div
        class="robo-chat-meta"
        [ngClass]="{ 'robo-chat-meta--menu-open': openMenuChatId === item.chat.id }"
      >
        <div
          ngbDropdown
          class="robo-chat-menu"
          container="body"
          (openChange)="setMenuOpen(item.chat.id, $event)"
        >
          <button
            class="robo-icon-button"
            type="button"
            ngbDropdownToggle
            aria-label="Chat actions"
            (click)="$event.stopPropagation()"
          >
            <i-bs name="three-dots"></i-bs>
          </button>
          <div ngbDropdownMenu class="shadow">
            <button
              ngbDropdownItem
              type="button"
              (click)="renameChat(item.chat, $event)"
            >
              Rename
            </button>
            <button
              ngbDropdownItem
              type="button"
              (click)="togglePinned(item.chat, $event)"
            >
              {{ item.chat.pinned ? 'Unpin' : 'Pin' }}
            </button>
            <button
              ngbDropdownItem
              type="button"
              class="text-danger"
              (click)="deleteChat(item.chat, $event)"
            >
              Delete
            </button>
          </div>
        </div>

        <div class="robo-chat-time small text-body-secondary">{{ lastMessageTime(item) }}</div>
      </div>
    </div>
  </section>
</div>
