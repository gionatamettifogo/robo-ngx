<div class="robo-chats-page">
  <div class="robo-page-title h3 mb-4 text-center">How can I help you today?</div>

  <pngx-robo-chat-composer
    [value]="prompt"
    (valueChange)="prompt = $event"
    [disabled]="creating"
    [submitDisabled]="creating || !prompt.trim()"
    (submit)="createChat()"
  />

  <div *ngIf="!loading && chatItems.length === 0" class="robo-empty-state text-body-secondary">
    No chats yet.
  </div>

  <section class="robo-chat-list" *ngIf="!loading && chatItems.length > 0">
    <div
      class="robo-chat-row"
      *ngFor="let item of chatItems; trackBy: trackByChatId"
      (click)="openChat(item.chat.id)"
    >
      <div class="robo-chat-main">
        <div class="robo-chat-title fw-semibold">
          {{ item.chat.title }}
        </div>
        <div class="robo-chat-preview small text-body-secondary">
          {{ lastMessagePreview(item) }}
        </div>
      </div>

      <div
        class="robo-chat-meta"
      >
        <div class="robo-chat-actions">
          <pngx-robo-icon-action-button
            icon="pencil"
            [tooltip]="renameChatTooltip"
            [ariaLabel]="renameChatAriaLabel"
            (pressed)="renameChat(item.chat, $event)"
          />
          <pngx-robo-icon-action-button
            icon="trash"
            [tooltip]="deleteChatTooltip"
            [ariaLabel]="deleteChatAriaLabel"
            (pressed)="deleteChat(item.chat, $event)"
          />
        </div>

        <div class="robo-chat-time small text-body-secondary">{{ lastMessageTime(item) }}</div>
      </div>
    </div>
  </section>
</div>
